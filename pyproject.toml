[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kivi-memory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "doublemetaphone>=1.1",
    "openai>=1.12.0",
    "pydantic>=2.6.1",
    "python-dotenv>=1.0.1"
]

[project.scripts]
kivi = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]
